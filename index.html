<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors Game - Play Online</title>

    <meta
        name="description"
        content="Play a fun and interactive Rock Paper Scissors game online. Choose rock, paper, or scissors and compete against the computer."
    >

    <meta
        name="keywords"
        content="rock paper scissors, rock paper scissors game, online game, play rock paper scissors"
    >

    <meta name="author" content="Nishant">

    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Rock Paper Scissors Game - Play Online">

    <meta
        property="og:description"
        content="Play Rock Paper Scissors online and challenge the computer."
    >

    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="rock.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Rock Paper Scissors</h1>

        <p class="subtitle">
            Choose your move and beat the computer!
        </p>
    </header>


    <main>

        <!-- Choices -->
        <section
            class="choices"
            aria-label="Choose your move"
        >

            <div
                id="rock"
                class="choice"
                role="button"
                tabindex="0"
                aria-label="Choose Rock"
            >
                <img
                    src="rock.png"
                    alt="Rock"
                >
            </div>


            <div
                id="paper"
                class="choice"
                role="button"
                tabindex="0"
                aria-label="Choose Paper"
            >
                <img
                    src="paper.png"
                    alt="Paper"
                >
            </div>


            <div
                id="scissor"
                class="choice"
                role="button"
                tabindex="0"
                aria-label="Choose Scissors"
            >
                <img
                    src="scissors.png"
                    alt="Scissors"
                >
            </div>

        </section>


        <!-- Score Board -->
        <section
            class="score-board"
            aria-label="Game score"
        >

            <div class="score">

                <p
                    id="user-score"
                    class="score-number"
                >
                    0
                </p>

                <p>You</p>

            </div>


            <div class="score">

                <p
                    id="computer-score"
                    class="score-number"
                >
                    0
                </p>

                <p>Computer</p>

            </div>

        </section>


        <!-- High Score -->
        <section
            class="high-score"
            aria-label="High score"
        >

            <p>High Score</p>

            <p id="high-score">
                0
            </p>

        </section>


        <!-- Game Message -->
        <section
            class="msg-container"
            aria-live="polite"
        >

            <p id="msg">
                Play Your Move
            </p>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
